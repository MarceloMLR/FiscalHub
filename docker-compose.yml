# Infra local para rodar o FiscalHub "Azure sem Azure".
# Blob e SQL sobem como containers; o mock de compliance e o host rodam via `dotnet run`
# na máquina, apontando para estes serviços.
#
#   docker compose up -d
#
services:
  # Emula o Azure Blob Storage (e Queue). Equivalente local do Blob de produção.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --location /data --loose --skipApiVersionCheck
    ports:
      - "10000:10000" # blob
      - "10001:10001" # queue
    volumes:
      - azurite-data:/data

  # Equivalente local do Azure SQL. Edition Developer (gratuita).
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  # Emulador do Azure Service Bus (fila local). Depende do SQL Server como backing store.
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on:
      - sql
    ports:
      - "5672:5672"   # AMQP
      - "5300:5300"   # health/admin
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sql
      MSSQL_SA_PASSWORD: "Local_Dev_123!"
    volumes:
      - ./docker/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro

  # Emulador da API do Key Vault: o cofre dos segredos de conector no dev (ADR-0027). O host fala com ele pelo mesmo
  # adapter e o mesmo SecretClient de produção. Versão fixada (conferida na tarefa 5.5 da change connect-avalara-sandbox).
  # SEM VOLUME, SEM IMPORT E SEM EXPORT, de propósito: a persistência do emulador grava os segredos em claro no disco.
  # O preço é que reiniciar o container apaga os segredos — a tela de conectores mostra "não configurado" e o envio
  # falha apontando para ela; é só digitar de novo na tela.
  keyvault:
    image: nagyesta/lowkey-vault:7.3.112
    ports:
      - "8443:8443"   # API do Key Vault (HTTPS, certificado padrão do emulador, fixado em appsettings.Development.json)

volumes:
  azurite-data:
  sql-data:
